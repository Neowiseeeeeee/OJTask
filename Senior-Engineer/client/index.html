    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Structured Data: FAQ (targets zero-competition long-tail searches) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How do I track OJT hours as a Philippine college student?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "OJTask lets you log your OJT hours every day from any device. Each entry is time-stamped and submitted to your supervisor for approval. At the end of your internship, you can export a complete DTR (Daily Time Record) with one click — no spreadsheets or manual counting required."
          }
        },
        {
          "@type": "Question",
          "name": "What is a daily scrum in OJT and why does it matter?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A daily scrum is a short structured update where interns report what they did, what they plan to do, and any blockers they are facing. In OJTask, this takes under two minutes and gives supervisors real-time visibility into each intern's progress — replacing lengthy status meetings or manual reports."
          }
        },
        {
          "@type": "Question",
          "name": "Can school coordinators monitor interns across multiple companies?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. School coordinators in OJTask get a program-wide dashboard showing OJT hours, attendance, document submissions, and practicum progress for all students — even across different host companies."
          }
        },
        {
          "@type": "Question",
          "name": "What OJT documents can I manage in OJTask?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "OJTask supports all standard Philippine OJT requirements: MOA (Memorandum of Agreement), endorsement letters, acceptance letters, weekly journals, terminal reports, and evaluation forms."
          }
        },
        {
          "@type": "Question",
          "name": "Is OJTask free for students and schools?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes — OJTask is completely free to start. Students join a space with a code shared by their supervisor. No credit card required and no time limit on the free tier."
          }
        }
      ]
    }
    </script>

    <!-- Dark mode init (no-FOUC) -->
    <script>
      (function(){
        var stored = localStorage.getItem('ojtask-theme');
        var theme = (stored && ['light','dark','system'].indexOf(stored) !== -1) ? stored : 'dark';
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
