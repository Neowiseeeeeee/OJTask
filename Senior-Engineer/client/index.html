    <!-- Primary SEO -->
    <title>OJTask — OJT Management System for Philippine Interns &amp; Supervisors</title>
    <meta name="description" content="OJTask is the all-in-one OJT management platform built for the Philippines. Track intern hours, submit daily scrums, manage tasks and documents — all in one shared workspace for students, supervisors, and school coordinators." />
    <meta name="keywords" content="OJT management system, on-the-job training Philippines, intern management, OJT tracker, daily scrum OJT, OJT hours tracking, internship management system Philippines, OJTask" />
    <meta name="robots" content="index, follow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#6d28d9" />
    <link rel="canonical" href="https://ojtask.onrender.com" />

    <!-- Open Graph (Facebook, LinkedIn, Messenger) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ojtask.onrender.com" />
    <meta property="og:site_name" content="OJTask" />
    <meta property="og:title" content="OJTask — OJT Management System for Philippine Interns &amp; Supervisors" />
    <meta property="og:description" content="Bring students, supervisors, and school coordinators into one shared workspace. Daily reports, time logs, and documents — handled without the back-and-forth." />
    <meta property="og:image" content="/ojtask-logo.png" />
    <meta property="og:locale" content="en_PH" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OJTask — OJT Management System for Philippine Interns &amp; Supervisors" />
    <meta name="twitter:description" content="Bring students, supervisors, and school coordinators into one shared workspace. Daily reports, time logs, and documents — handled without the back-and-forth." />
    <meta name="twitter:image" content="/ojtask-logo.png" />

    <!-- Structured Data: WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "OJTask",
      "url": "https://ojtask.onrender.com",
      "description": "OJTask is an OJT (On-the-Job Training) management platform built for the Philippines, helping students, supervisors, and school coordinators manage internship tasks, hours, daily scrums, and documents in one shared workspace.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "PHP"
      },
      "inLanguage": "en-PH",
      "audience": {
        "@type": "Audience",
        "audienceType": "Students, OJT Supervisors, School Coordinators"
      }
    }
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Google Fonts — only the 2 families actually used -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6PRD6SX3XW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-6PRD6SX3XW');
    </script>

    <!-- Dark mode init (no-FOUC) -->
    <script>
      (function(){
        var stored = localStorage.getItem('ojtask-theme');
        var theme = (stored && ['light','dark','system'].indexOf(stored) !== -1) ? stored : 'dark';
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
